{% for event in duel.chat_events %}<div class="duel-chat-event {{event.side}} {{event.kind}}">{% if event.author %}<small{% if player_name_color(event.author) %} style="color:{{player_name_color(event.author)}}"{% endif %}>{{event.author.nickname}}</small>{% else %}<small>ARENA X1</small>{% endif %}<div>{{event.message}}</div>{% if event.created_at %}<time>{{event.created_at}}</time>{% endif %}</div>{% endfor %}
