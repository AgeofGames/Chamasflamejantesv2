<section class="guide-card hub-note-card" id="minhas-anotacoes"><span class="guide-label">MINHA COLEÇÃO</span>{% if social_user %}{% set saved=hub_build_note(build.id) %}<form method="post" action="{{url_for('hub_save_build',build_id=build.id)}}"><input type="hidden" name="_csrf" value="{{csrf_token()}}"><label class="hub-check"><input type="checkbox" name="favorite" value="1"{% if saved.favorite %} checked{% endif %}> ⭐ Favoritar esta build</label><label>Minhas anotações<textarea name="notes" maxlength="6000" rows="6" placeholder="O que adaptar no mapa? Em que momento atacar?">{{saved.notes}}</textarea></label><small>Somente você pode ler estas anotações.</small><button class="btn primary">Salvar na minha conta</button><a class="mini-link" href="{{url_for('hub_builds')}}">Abrir minha coleção →</a></form>{% else %}<p>Guarde esta estratégia e escreva anotações privadas para seus treinos.</p><a class="btn" href="{{url_for('social_login',next=request.path)}}">Entrar para salvar</a>{% endif %}</section>
